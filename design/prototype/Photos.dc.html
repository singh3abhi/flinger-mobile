.body{flex:1;padding:24px 20px 0}

.add{width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center}
.tips{margin:18px 0 0;font-size:13px;line-height:1.5;font-weight:500}
.foot{display:flex;align-items:center;gap:16px;padding:12px 20px 34px}
.fine{flex:1;font-size:13px;line-height:1.45;font-weight:700}
.go{width:56px;height:56px;border-radius:50%;background:#E4572E;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 4px rgba(0,0,0,.25)}
