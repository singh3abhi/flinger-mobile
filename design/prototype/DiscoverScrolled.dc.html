.pass{position:absolute;left:20px;bottom:104px;width:56px;height:56px;border-radius:50%;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
