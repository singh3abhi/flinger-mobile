<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.nav{width:390px;height:84px;display:flex;background:#FFFBF8;border-top:1px solid #EFE3DA;padding:8px 8px 0}
.it{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;font-size:11px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E4572E;color:#1A1A1A;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<nav class="nav" aria-label="Main">
  <a class="it" href="Discover.dc.html" style="color:{{c.discover}};font-weight:{{w.discover}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg>
    <span>Discover</span>
  </a>
  <a class="it" href="LikedYou.dc.html" style="color:{{c.liked}};font-weight:{{w.liked}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <span>Liked You</span>
    <span class="bd">6</span>
  </a>
  <a class="it" href="Chats.dc.html" style="color:{{c.chats}};font-weight:{{w.chats}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    <span>Chats</span>
    <span class="bd">2</span>
  </a>
  <a class="it" href="MyProfile.dc.html" style="color:{{c.profile}};font-weight:{{w.profile}}">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profile</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["discover","liked","chats","profile"],"default":"discover"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
  const a = this.props.active ?? 'discover';
  const on = '#B8431F', off = '#5C5C63';
  const c = {}, w = {};
  ['discover','liked','chats','profile'].forEach((k) => { c[k] = (k === a) ? on : off; w[k] = (k === a) ? 700 : 500; });
  return { c, w };
}
}
</script>
</body>
</html>
